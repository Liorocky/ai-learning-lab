<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Learning Lab — 交互式学习页面的总索引与导航台。" />
  <title>AI Learning Lab · 索引</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="mask-icon" href="favicon.svg" color="#cbff62" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <style>
    .shell { width:min(1180px,calc(100% - 40px)); margin:auto; position:relative; z-index:1; }

    .topbar { height:64px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .pulse { width:9px; height:9px; border-radius:50%; background:var(--lime); box-shadow:0 0 0 5px rgba(203,255,98,.08),0 0 16px var(--lime); }
    .status { color:var(--muted); font-size:11px; } .status b { color:var(--lime); font-weight:500; }

    .hero { display:grid; grid-template-columns:1.25fr .75fr; gap:56px; padding:74px 0 54px; align-items:end; }
    .eyebrow { color:var(--lime); font-size:11px; letter-spacing:.11em; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; } h1,h2 { font-family:"Noto Serif SC",serif; }
    h1 { font-size:clamp(40px,6vw,76px); letter-spacing:-.055em; line-height:1.08; margin:12px 0 18px; font-weight:900; }
    .hero p { color:#b6b5b0; font-size:15px; max-width:560px; margin:0; }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
    .stat { background:var(--panel2); padding:18px 20px; }
    .stat b { display:block; font-size:34px; font-weight:500; color:var(--lime); line-height:1.1; }
    .stat span { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }

    .toolbar { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:44px; }
    .search { flex:1; min-width:220px; display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#0b0e0d; padding:9px 12px; }
    .search input { flex:1; background:none; border:0; outline:none; color:var(--ink); font-size:12px; }
    .search input::placeholder { color:#6c6d69; }
    .search i { color:var(--lime); font-style:normal; font-size:12px; }
    .tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .tab { border:1px solid var(--line); background:none; color:var(--muted); padding:7px 11px; font-size:11px; transition:.18s; }
    .tab:hover { color:var(--ink); border-color:rgba(233,229,221,.32); }
    .tab.on { border-color:var(--lime); color:#0d1209; background:var(--lime); }

    section.cat { margin-bottom:56px; scroll-margin-top:16px; }
    .cat-head { display:flex; justify-content:space-between; align-items:baseline; gap:20px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:18px; }
    .cat-head h2 { font-size:clamp(22px,3vw,30px); letter-spacing:-.03em; margin:0; font-weight:700; }
    .cat-head .meta { color:var(--muted); font-size:11px; text-align:right; }
    .cat-head .slug { color:var(--blue); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }

    .card { display:block; background:var(--panel); border:1px solid var(--line); padding:22px; position:relative; transition:border-color .2s,transform .2s,background .2s; }
    .card:hover { border-color:rgba(203,255,98,.5); transform:translateY(-2px); background:#141816; }
    .card .idx { color:var(--lime); font-size:11px; letter-spacing:.08em; }
    .card h3 { font-size:19px; font-weight:500; margin:10px 0 8px; letter-spacing:-.015em; font-family:"Noto Serif SC",serif; }
    .card p { color:#a8a9a3; font-size:12px; margin:0 0 16px; }
    .card .tags { display:flex; gap:6px; flex-wrap:wrap; }
    .tag { font-size:10px; color:var(--muted); border:1px solid var(--line); padding:2px 7px; }
    .card .path { margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.06); color:#6f716c; font-size:10px; word-break:break-all; }
    .card .arrow { position:absolute; top:20px; right:20px; color:var(--muted); font-size:13px; transition:.2s; }
    .card:hover .arrow { color:var(--lime); transform:translate(2px,-2px); }

    .empty { border:1px dashed var(--line); padding:38px; text-align:center; color:var(--muted); font-size:12px; }

    .foot { border-top:1px solid var(--line); padding:26px 0 52px; color:var(--muted); font-size:11px; display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap; }
    .foot code { color:var(--blue); }

    @media(max-width:820px){ .hero { grid-template-columns:1fr; gap:30px; padding:50px 0 40px; } .cat-head { display:block; } .cat-head .meta { text-align:left; margin-top:6px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><i class="pulse"></i> AI Learning Lab</div>
      <div class="status"><b>●</b> static / offline-first</div>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">index / 交互式学习页面</div>
        <h1>把抽象机制<br>做成能动手的页面。</h1>
        <p>每个条目都是一个自包含的单页实验：无后端、无构建、无 API 调用，双击即可打开。按主题分类归档，随时增补。</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="count-labs">0</b><span>页面 / labs</span></div>
        <div class="stat"><b id="count-cats">0</b><span>分类 / categories</span></div>
      </div>
    </section>

    <div class="toolbar">
      <label class="search"><i>/</i><input id="q" type="search" placeholder="搜索标题、描述或标签…" aria-label="搜索页面" /></label>
      <div class="tabs" id="tabs"></div>
    </div>

    <div id="list"></div>

    <footer class="foot">
      <span>新增页面：在 <code>html/&lt;分类&gt;/&lt;slug&gt;/index.html</code> 建目录，再把条目追加到本页 <code>LABS</code> 数组。</span>
      <span>AI Learning Lab · MIT</span>
    </footer>
  </main>

<script>
/* ────────────────────────────────────────────────────────────
   页面注册表。新增一个 html 页面时，只改这一个数组：
   1. path   —— 相对本文件的路径（必须以 index.html 结尾）
   2. cat    —— 所属分类 key，见下方 CATEGORIES
   3. tags   —— 便于搜索的关键词
   ──────────────────────────────────────────────────────────── */
const CATEGORIES = [
  { key: 'llm-core',    name: '大模型基础机制', desc: 'tokenizer、上下文窗口、注意力、采样与解码' },
  { key: 'prompting',   name: '提示工程与输出控制', desc: '结构化输出、few-shot、约束与失败处理' },
  { key: 'rag',         name: '检索增强与知识库', desc: '切分、向量检索、重排、引用与评估' },
  { key: 'agents',      name: 'Agent 与工具调用', desc: 'function calling、规划、多智能体、workflow' },
  { key: 'engineering', name: '工程化与运维', desc: '推理性能、缓存、成本、评估与可观测性' },
  { key: 'playground',  name: '实验场', desc: '零散想法、草稿与可视化试验' }
];

const LABS = [
  {
    cat: 'llm-core',
    title: 'LLM Runtime Lab',
    desc: '一次调用如何发生：Token 切分、上下文预算、位置注意力、采样参数，外加 26 条工程概念速查。',
    path: './llm-core/llm-runtime-lab/index.html',
    tags: ['token', 'tokenizer', '上下文窗口', 'context window', 'temperature', 'top-p', 'top-k', 'softmax', '采样', '注意力', 'logprob', '置信度', 'finish_reason', 'prompt caching', 'reasoning_content', '结构化输出']
  }
];

/* ── 渲染逻辑，通常无需改动 ───────────────────────────────── */
const listEl = document.getElementById('list');
const tabsEl = document.getElementById('tabs');
const qEl = document.getElementById('q');
let activeCat = 'all';

function renderTabs() {
  const items = [{ key: 'all', name: '全部' }].concat(
    CATEGORIES.filter(c => LABS.some(l => l.cat === c.key)).map(c => ({ key: c.key, name: c.name }))
  );
  tabsEl.innerHTML = items.map(c =>
    `<button class="tab${c.key === activeCat ? ' on' : ''}" data-cat="${c.key}">${c.name}</button>`
  ).join('');
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const match = l => {
    if (activeCat !== 'all' && l.cat !== activeCat) return false;
    if (!q) return true;
    return (l.title + ' ' + l.desc + ' ' + (l.tags || []).join(' ')).toLowerCase().includes(q);
  };

  let n = 0;
  listEl.innerHTML = CATEGORIES.map(cat => {
    const items = LABS.filter(l => l.cat === cat.key && match(l));
    if (!items.length) return '';
    return `<section class="cat" id="cat-${cat.key}">
      <header class="cat-head">
        <div><h2>${cat.name}</h2></div>
        <div class="meta"><span class="slug">html/${cat.key}/</span> · ${cat.desc}</div>
      </header>
      <div class="grid">${items.map(l => {
        n++;
        return `<a class="card" href="${l.path}">
          <span class="arrow">↗</span>
          <span class="idx">${String(LABS.indexOf(l) + 1).padStart(2, '0')}</span>
          <h3>${l.title}</h3>
          <p>${l.desc}</p>
          <div class="tags">${(l.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="path">${l.path.replace('./', '')}</div>
        </a>`;
      }).join('')}</div>
    </section>`;
  }).join('');

  if (!n) listEl.innerHTML = '<div class="empty">没有匹配的页面。换个关键词，或切换到「全部」。</div>';
  document.getElementById('count-labs').textContent = LABS.length;
  document.getElementById('count-cats').textContent = new Set(LABS.map(l => l.cat)).size;
}

tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  renderTabs();
  render();
});
qEl.addEventListener('input', render);

renderTabs();
render();
</script>
</body>
</html>
